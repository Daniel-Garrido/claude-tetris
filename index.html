<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro" title="Cambiar tema">☀️</button>
    <h1 class="title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Tabla de records (solo en GAME OVER) -->
        <div id="go-records" class="records-block rec-hidden">
          <p id="go-records-msg" class="records-msg"></p>
          <form id="name-form" class="name-form rec-hidden" autocomplete="off">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" spellcheck="false" />
            <button id="save-record-btn" type="submit">Guardar</button>
          </form>
          <span class="label">MEJORES PUNTUACIONES</span>
          <ol id="go-records-list" class="records-list"></ol>
          <button id="home-btn" type="button">Pantalla de inicio</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Pantalla de inicio con records -->
    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <p class="start-title">TETRIS</p>
        <div class="records-block">
          <span class="label">MEJORES PUNTUACIONES</span>
          <ol id="start-records-list" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <strong id="best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="max-lines">0</strong></span>
          </div>
        </div>
        <button id="play-btn" type="button">Jugar</button>
        <div class="reset-records">
          <button id="reset-records-btn" type="button">Borrar records</button>
          <div id="reset-confirm" class="reset-confirm rec-hidden">
            <span>¿Borrar todos los records?</span>
            <button id="reset-yes-btn" type="button">Sí, borrar</button>
            <button id="reset-no-btn" type="button">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
